<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashQuiz · Panel</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
  header { display: flex; gap: 1em; align-items: center; padding: .5em 1em; background: var(--ink); color: #fff; font-weight: 700; }
  header .grow { flex: 1; }
  header .pill { font-weight: 400; font-size: .9em; }

  .stage { display: grid; grid-template-columns: 1fr minmax(220px, 26vw); gap: 1em; padding: 1em; min-height: 0; }
  .main { display: flex; flex-direction: column; gap: 1em; min-height: 0; overflow: hidden; }
  .side { display: flex; flex-direction: column; gap: .8em; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 1em; min-height: 0; overflow: hidden; }

  .qr { width: 100%; aspect-ratio: 1; background: #fff; image-rendering: pixelated; }
  .url { font: 700 clamp(1em, 1.8vw, 1.6em)/1.2 ui-monospace, Menlo, Consolas, monospace; text-align: center; overflow-wrap: anywhere; }
  .side .qr { width: min(100%, 30vh); align-self: center; }
  .side h3 { margin: 0; font-size: 1em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .stat { font-size: 2.2em; font-weight: 800; text-align: center; }
  .stat small { display: block; font-size: .4em; font-weight: 600; color: var(--muted); }

  /* Lobby */
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 2em; align-items: center; }
  .lobby .bigqr { width: min(42vh, 36vw); }
  .lobby h1 { font-size: clamp(2em, 4vw, 3.6em); margin: 0 0 .3em; }
  .steps { font-size: clamp(1.1em, 1.8vw, 1.6em); margin: 0; padding-left: 1.2em; }
  .steps li { margin: .4em 0; }
  .wifiqr { width: min(20vh, 14vw); vertical-align: middle; }
  .chips { display: flex; flex-wrap: wrap; gap: .4em; align-content: flex-start; overflow: hidden; }
  .chip { padding: .25em .7em; border: 2px solid var(--ink); border-radius: 999px; background: var(--panel); font-weight: 600; }
  .chip.off { border-style: dashed; color: var(--muted); }
  .chip.done::before { content: "✓ "; }

  /* Question */
  .qtop { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 1.3em; }
  .qtime { font-size: 2.4em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .qtext { font-size: clamp(1.6em, 3.4vw, 3em); font-weight: 800; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; flex: 1; min-height: 0; }
  .grid .choice { font-size: clamp(1.2em, 2.4vw, 2.2em); min-height: 0; position: relative; overflow: hidden; }
  .grid .count { font-size: .9em; font-variant-numeric: tabular-nums; }
  .grid .fill { position: absolute; left: 0; bottom: 0; height: 8px; background: currentColor; }

  /* Leaderboard */
  .lb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3em; }
  .lb li { display: flex; gap: .6em; padding: .3em .5em; border-bottom: 1px solid var(--line); }
  .lb .r { width: 2em; font-weight: 800; }
  .lb .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .s { font-variant-numeric: tabular-nums; font-weight: 700; }
  .final .lb { font-size: clamp(1.2em, 2.2vw, 2em); }
  .final h1 { margin: 0; font-size: clamp(2em, 4vw, 3.4em); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: .4em; align-items: center; padding: .5em 1em; font-size: .9em; background: #e2e2dc; border-top: 2px solid var(--line); }
  .controls .sep { width: 2px; align-self: stretch; background: var(--line); }
  .controls .grow { flex: 1; }
  .controls button { padding: .4em .7em; }
  #packSel { max-width: 15em; }
  #primary { min-width: 9em; font-size: 1.15em; }
  #primary kbd { font: inherit; font-size: .7em; opacity: .8; }
  #settings { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; width: 100%; padding-top: .5em; border-top: 1px solid var(--line); }
  #settings label { display: flex; gap: .4em; align-items: center; }
  #msg { color: var(--bad); font-weight: 600; }
  body.nocontrols .controls { display: none; }
  body.nocontrols { grid-template-rows: auto 1fr; }
  .stage.solo { grid-template-columns: 1fr; }
</style>
</head>
<body>
<header>
  <span>⚡ FlashQuiz</span>
  <span class="grow pill" id="hPack">Sin cuestionario cargado</span>
  <span class="pill" id="hPhase"></span>
  <span class="pill" id="hNet">○ conectando…</span>
</header>

<div class="stage">
  <section class="main" id="main"></section>
  <aside class="side">
    <h3>Unite</h3>
    <img class="qr" id="sideQr" alt="Código QR para unirse">
    <div class="url" id="sideUrl"></div>
    <div class="stat" id="sideStat"></div>
    <div id="sideExtra" style="min-height:0;overflow:hidden"></div>
  </aside>
</div>

<div class="controls" id="controls">
  <select id="packSel" title="Cuestionario"></select>
  <button id="btnLoad">Cargar</button>
  <label><button id="btnUpload" type="button">Subir…</button><input type="file" id="file" accept=".json,application/json" hidden></label>
  <span class="sep"></span>
  <button id="primary" class="primary">Empezar</button>
  <button id="btnEnd">Terminar</button>
  <button id="btnRestart" title="Mismos jugadores, puntajes en cero">Reiniciar</button>
  <button id="btnReset" title="Saca a todos y vuelve a la sala de espera">Vaciar</button>
  <a id="csv" href="/results.csv" download><button type="button">CSV</button></a>
  <span class="grow"></span>
  <span id="msg"></span>
  <button id="btnSettings">Red</button>
  <button id="btnHide" title="Ocultar controles — apretá H para volver a mostrarlos">Ocultar</button>
  <div id="settings" class="hidden">
    <label>Dirección para unirse <select id="ipSel"></select></label>
    <label>o escribila <input id="ipInput" size="15" placeholder="192.168.43.1"></label>
    <button id="btnIp">Usar</button>
    <span class="sep"></span>
    <label>Nombre del Wi-Fi <input id="ssid" size="14"></label>
    <label>Contraseña <input id="pass" size="14" type="password"></label>
    <button id="btnWifi">Mostrar QR del Wi-Fi</button>
  </div>
</div>

<script>
(function () {
  var SHAPES = ['▲', '◆', '●', '■'], LETTERS = 'ABCD';
  var PHASE = { lobby: 'Sala de espera', question: 'Pregunta', reveal: 'Respuesta', end: 'Resultados finales' };
  var $ = function (id) { return document.getElementById(id); };
  var key = new URLSearchParams(location.search).get('key') || '';
  var S = null, tick = null, lastQrKey = '', lastQKey = '';

  function k(url) { return key ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(key) : url; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function act(name, body) {
    $('msg').textContent = '';
    return fetch(k('/api/host/' + name), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.error) $('msg').textContent = j.error; return j; })
      .catch(function (e) { $('msg').textContent = e.message; });
  }
  $('csv').href = k('/results.csv');

  // ---------------------------------------------------------- live state
  var es = new EventSource(k('/host/events'));
  es.onopen = function () { $('hNet').textContent = '● en vivo'; };
  es.onerror = function () { $('hNet').textContent = '○ reconectando…'; };
  es.onmessage = function (ev) { var m = JSON.parse(ev.data); if (m.type === 'state') render(m); };

  function joinUrl(s) {
    // If the server couldn't detect its LAN IP (e.g. Termux on the hotspot phone)
    // but this page was opened via a LAN address, that address works for students too.
    if (s.join.url) return s.join.url;
    if (!/^(localhost|127\.|\[::1\])/.test(location.hostname)) return location.protocol + '//' + location.host + '/';
    return '';
  }

  function render(s) {
    S = s;
    var url = joinUrl(s);
    $('hPack').textContent = s.pack ? s.pack.title + ' · ' + s.pack.count + ' preguntas' : 'Sin cuestionario cargado';
    $('hPhase').textContent = PHASE[s.phase] + (s.question && s.phase !== 'end' ? ' ' + (s.question.index + 1) + '/' + s.question.total : '');

    // QR only re-requested when the URL actually changes.
    var qrKey = url + '|' + (s.join.wifi ? s.join.wifi.ssid : '');
    if (qrKey !== lastQrKey) {
      lastQrKey = qrKey;
      $('sideQr').src = url ? '/qr/join.svg?url=' + encodeURIComponent(url) : '';
      $('sideUrl').textContent = url ? url.replace(/^http:\/\//, '').replace(/\/$/, '') : 'Sin dirección de red — abrí «Red»';
      fillIpSelect(s);
    }

    var lobby = s.phase === 'lobby';
    document.querySelector('.side').classList.toggle('hidden', lobby);
    document.querySelector('.stage').classList.toggle('solo', lobby);
    $('sideStat').innerHTML = s.phase === 'question'
      ? s.answered + ' / ' + s.online + '<small>respondieron</small>'
      : s.online + '<small>conectados</small>';
    $('sideExtra').innerHTML = s.phase === 'reveal' ? '<h3>Top 3</h3>' + lbHtml(s.leaderboard.slice(0, 3)) : '';

    if (lobby) renderLobby(s, url);
    else if (s.phase === 'question' || s.phase === 'reveal') renderQuestion(s);
    else renderEnd(s);

    var label = { lobby: 'Empezar ▶', question: 'Mostrar respuesta', reveal: 'Siguiente ▶', end: 'Reiniciar' }[s.phase];
    if (s.phase === 'reveal' && s.question && s.question.index + 1 >= s.question.total) label = 'Resultados ▶';
    $('primary').innerHTML = label + ' <kbd>Espacio</kbd>';
    $('primary').disabled = !s.pack;
  }

  var lastLobbyKey = '';
  function renderLobby(s, url) {
    lastQKey = '';
    var wifi = s.join.wifi;
    var lobbyKey = url + '|' + (wifi ? wifi.ssid + wifi.v : '');
    if (lobbyKey === lastLobbyKey && $('chips')) return renderChips(s);
    lastLobbyKey = lobbyKey;
    var steps = '';
    if (wifi) steps += '<li>Conectate al Wi-Fi <b>' + esc(wifi.ssid) + '</b><br><img class="wifiqr" src="' + k('/qr/wifi.svg?v=' + wifi.v) + '" alt="QR del Wi-Fi"></li>';
    else steps += '<li>Conectate al Wi-Fi del aula</li>';
    steps += '<li>Escaneá el código QR o abrí<br><b class="url" style="text-align:left;display:block">' + esc(url.replace(/^http:\/\//, '').replace(/\/$/, '')) + '</b></li>';
    steps += '<li>Escribí tu nombre y esperá</li>';
    $('main').innerHTML =
      '<div class="lobby">' +
        '<img class="qr bigqr" src="' + (url ? '/qr/join.svg?url=' + encodeURIComponent(url) : '') + '" alt="Código QR para unirse">' +
        '<div><h1>Sumate al quiz</h1><ol class="steps">' + steps + '</ol></div>' +
      '</div>' +
      '<div class="stat" style="text-align:left" id="joined"></div>' +
      '<div class="chips" id="chips"></div>';
    renderChips(s);
  }
  function renderChips(s) {
    $('joined').textContent = s.online + (s.online === 1 ? ' conectado' : ' conectados');
    $('chips').innerHTML = s.players.map(function (p) {
      return '<span class="chip' + (p.online ? '' : ' off') + '" data-id="' + p.id + '" title="Clic para sacar">' + esc(p.name) + '</span>';
    }).join('');
  }

  function renderQuestion(s) {
    lastLobbyKey = '';
    var q = s.question, reveal = s.phase === 'reveal';
    var qKey = q.index + '|' + s.phase;
    var total = Math.max(1, s.answered);
    if (qKey !== lastQKey) {
      // Full rebuild only on question/phase change; live counts patch text nodes.
      lastQKey = qKey;
      $('main').innerHTML =
        '<div class="qtop"><span>Pregunta ' + (q.index + 1) + ' de ' + q.total + '</span><span class="qtime" id="qtime"></span></div>' +
        (reveal ? '' : '<div class="timebar"><div id="qbar"></div></div>') +
        '<p class="qtext">' + esc(q.text) + '</p>' +
        '<div class="grid">' + q.choices.map(function (c, i) {
          var cls = 'choice k' + i + (reveal ? (i === q.answer ? ' right' : ' dim') : '');
          return '<div class="' + cls + '"><span class="sym"><b>' + SHAPES[i] + '</b><i>' + LETTERS[i] + '</i></span>' +
            '<span class="txt">' + esc(c) + (reveal && i === q.answer ? ' ✓' : '') + '</span>' +
            (reveal ? '<span class="count" id="cnt' + i + '"></span><span class="fill" id="fill' + i + '"></span>' : '') + '</div>';
        }).join('') + '</div>';
      clearInterval(tick);
      if (!reveal) {
        var deadline = Date.now() + q.remainingMs, bar = $('qbar');
        bar.style.transform = 'scaleX(' + (q.remainingMs / (q.time * 1000)) + ')';
        bar.offsetWidth;
        bar.style.transition = 'transform ' + (q.remainingMs / 1000) + 's linear';
        bar.style.transform = 'scaleX(0)';
        var upd = function () { var el = $('qtime'); if (el) el.textContent = Math.ceil(Math.max(0, deadline - Date.now()) / 1000); };
        upd(); tick = setInterval(upd, 250);
      } else $('qtime').textContent = '';
    }
    if (reveal) s.counts.forEach(function (n, i) {
      $('cnt' + i).textContent = n + ' · ' + Math.round(100 * n / total) + '%';
      $('fill' + i).style.width = (100 * n / total) + '%';
    });
  }

  function renderEnd(s) {
    lastLobbyKey = '';
    lastQKey = ''; clearInterval(tick);
    $('main').innerHTML = '<div class="final"><h1>🏁 Resultados finales</h1>' + lbHtml(s.leaderboard) + '</div>';
  }

  function lbHtml(list) {
    if (!list.length) return '<p class="muted">No hay jugadores.</p>';
    return '<ol class="lb">' + list.map(function (r) {
      return '<li><span class="r">' + r.rank + '</span><span class="n">' + esc(r.name) + '</span><span class="s">' + r.score + '</span></li>';
    }).join('') + '</ol>';
  }

  // ---------------------------------------------------------- controls
  function primary() {
    if (!S) return;
    if (S.phase === 'end') return act('reset', { keepPlayers: true });
    act(S.phase === 'question' ? 'reveal' : 'next');
  }
  $('primary').onclick = primary;
  $('btnEnd').onclick = function () { if (confirm('¿Terminar el quiz y mostrar los resultados finales?')) act('end'); };
  $('btnRestart').onclick = function () { if (confirm('¿Reiniciar? Los puntajes vuelven a 0 y los jugadores se quedan.')) act('reset', { keepPlayers: true }); };
  $('btnReset').onclick = function () { if (confirm('¿Sacar a TODOS los jugadores y volver a la sala de espera?')) act('reset', { keepPlayers: false }); };
  $('btnLoad').onclick = function () { if ($('packSel').value) act('pack', { id: $('packSel').value }); };
  $('btnUpload').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { act('upload', { name: f.name, pack: JSON.parse(rd.result) }); }
      catch (e) { $('msg').textContent = f.name + ': JSON inválido'; }
    };
    rd.readAsText(f); this.value = '';
  };
  $('btnSettings').onclick = function () { $('settings').classList.toggle('hidden'); };
  $('btnHide').onclick = function () { document.body.classList.add('nocontrols'); };
  $('btnIp').onclick = function () { act('joinip', { ip: $('ipInput').value.trim() || $('ipSel').value }); };
  $('ipSel').onchange = function () { $('ipInput').value = ''; act('joinip', { ip: this.value }); };
  $('btnWifi').onclick = function () { act('wifi', { ssid: $('ssid').value.trim(), pass: $('pass').value }); };
  $('main').onclick = function (e) {
    var c = e.target.closest('.chip[data-id]');
    if (c && confirm('¿Sacar a ' + c.textContent + '?')) act('kick', { id: c.getAttribute('data-id') });
  };
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); primary(); }
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('nocontrols');
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });

  function fillIpSelect(s) {
    var cur = s.join.ip;
    var opts = s.join.addresses.map(function (a) { return '<option value="' + a.ip + '"' + (a.ip === cur ? ' selected' : '') + '>' + a.ip + ' (' + esc(a.iface) + ')</option>'; });
    if (cur && !s.join.addresses.some(function (a) { return a.ip === cur; })) opts.unshift('<option selected>' + esc(cur) + '</option>');
    $('ipSel').innerHTML = opts.join('') || '<option value="">no se detectó ninguna</option>';
  }

  fetch(k('/api/host/packs')).then(function (r) { return r.json(); }).then(function (j) {
    $('packSel').innerHTML = j.packs.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.error ? ' disabled' : '') + '>' + esc(p.title) + (p.error ? ' ⚠ ' + esc(p.error) : ' (' + p.count + ')') + '</option>';
    }).join('') || '<option value="">no hay cuestionarios en /packs</option>';
  });
})();
</script>
</body>
</html>
